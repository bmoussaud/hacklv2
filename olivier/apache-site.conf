<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/app/public

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
